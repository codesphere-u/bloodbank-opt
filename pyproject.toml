[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "bloodbank-opt"
version = "0.1.0"
description = "Zero-dependency blood-bank transfusion compatibility, O-negative conservation FEFO allocator, PRBC/platelet expiry auditor, and regional hub transfer matcher."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Akandwanaho Ivan Alvin" }]
keywords = [
    "blood-bank",
    "transfusion",
    "abo-compatibility",
    "healthcare-logistics",
    "fefo",
    "public-health",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
bloodbank-opt = "bloodbank_opt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bloodbank_opt"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
